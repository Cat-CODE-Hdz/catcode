              "description": "Publicación gestionada en Facebook e Instagram: 3, 5 o 7 publicaciones por semana según nivel."
            },
            "price": "79",
            "priceCurrency": "EUR",
            "billingDuration": "P1M"
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "FULL — Solución integral",
              "description": "Custom Pro + Weekly Pro + Social Pro integrados, con el setup de la web incluido."
            },
            "price": "199",
            "priceCurrency": "EUR",
            "billingDuration": "P1M"
          }

      }

    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué hacemos exactamente?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Agencia web para pequeños negocios: landing profesional, contenido semanal y publicación en redes. Todo conectado, sin complicaciones."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué incluye cada plan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CUSTOM: landing a medida (Basic/Pro/Premium). WEEKLY: 3, 5 o 7 piezas por semana según nivel. SOCIAL: publicación gestionada en Facebook e Instagram. FULL: Custom Pro + Weekly Pro + Social Pro integrados por 199 €/mes, con el setup de la web incluido."
          }
        },
        {
          "@type": "Question",
          "name": "¿Tengo permanencia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Sin permanencias. Cambia de nivel o cancela cuando quieras: bajas al siguiente ciclo y las subidas se prorratean."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué redes sociales gestionáis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Facebook e Instagram. Para redes adicionales, consulta: no están incluidas por defecto."
          }
        },
        {
          "@type": "Question",
          "name": "¿Respondéis mis mensajes privados o comentarios?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. No respondemos a comentarios ni a mensajes privados en ningún plan. Responder en nombre del negocio obliga a estar pendiente a diario de cada publicación: eso es community management, con su tiempo y su precio."
          }
        },
        {
          "@type": "Question",
          "name": "¿Hacéis publicidad (Ads)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No está incluido en los planes. Podemos asesorar, pero no gestionamos campañas de pago."
          }
        },
        {
          "@type": "Question",
          "name": "¿Tomáis fotografías o producís vídeo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No está incluido. El Reel de SOCIAL PREMIUM se crea reutilizando tu contenido del mismo mes (10-15 s)."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué pasa con mi landing si cancelo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La landing y el contenido son tuyos: una vez facturado y publicado, el derecho de uso es del cliente. Al cancelar dejamos de producir y publicar contenido nuevo."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo son los plazos de entrega?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Landing: 48-72 h (Basic), 5-7 días (Pro) y 7-10 días (Premium) desde la aprobación del diseño. Contenido semanal: 48 h antes de publicar."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo empezamos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Escríbenos por WhatsApp o rellena el formulario de contacto: “Cuéntanos qué necesita tu negocio.”"
          }
        }
      ]
    }
    </script>
